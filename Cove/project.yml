# project.yml — optional XcodeGen manifest for Inditalk.
#
# XcodeGen (https://github.com/yonasstephen/xcodegen — MIT licensed) is a BUILD-TIME
# convenience only; it generates the .xcodeproj from this manifest so the repo doesn't
# need to check in the fragile pbxproj. It ships NO runtime code and is not linked into
# the app. If you'd rather not install it, follow the "Manual Xcode setup" section in
# README.md instead — the app itself depends only on Apple frameworks.
#
# Usage:  brew install xcodegen && xcodegen generate && open Inditalk.xcodeproj

name: Inditalk
options:
  bundleIdPrefix: chat.cove
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

# Firebase is the chosen backend (project cove-7f31f). It is a documented 3rd-party
# dependency (Apache-2.0) added via Swift Package Manager. This is a deliberate
# deviation from the "Apple frameworks only" default — see docs/PHASE3_FIREBASE.md.
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"
  # WebRTC binary for voice/video (BSD-3, permissive). See docs/PHASE4_CALLING.md.
  # Wide range: stasel/WebRTC bumps its major per Chromium milestone (120, 123, …).
  WebRTC:
    url: https://github.com/stasel/WebRTC
    minVersion: "120.0.0"
    maxVersion: "200.0.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Signing team is configurable and NOT hardcoded in source. XcodeGen substitutes
    # the INDITALK_DEVELOPMENT_TEAM environment variable at generate time; unset => empty
    # (fine for Simulator builds, which don't sign). To preserve your team across
    # regenerates, export it first, e.g.:
    #   INDITALK_DEVELOPMENT_TEAM=ABCDE12345 xcodegen generate
    # or drop it in Inditalk/.xcodegen.env (gitignored) and `source` that before generating.
    DEVELOPMENT_TEAM: ${INDITALK_DEVELOPMENT_TEAM}
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "4"

targets:
  Inditalk:
    type: application
    platform: iOS
    sources:
      - path: Inditalk
        excludes:
          # Never bundle the sample Firebase config or the entitlements files into the
          # app. They are re-added below with `buildPhase: none` so they still show in
          # the project navigator as source/config, just not in a copy/compile phase.
          - "Resources/GoogleService-Info.SAMPLE.plist"
          - "Inditalk.entitlements"
          - "Inditalk.Release.entitlements"
      # Documentation only — the SAMPLE plist must never ship in the app. The REAL
      # GoogleService-Info.plist is gitignored; drop it in Inditalk/Resources/ and XcodeGen
      # will pick it up as a bundled resource automatically.
      - path: Inditalk/Resources/GoogleService-Info.SAMPLE.plist
        buildPhase: none
      # Entitlements are code-signing input (CODE_SIGN_ENTITLEMENTS), not a bundle
      # resource. Debug uses aps-environment=development, Release uses production —
      # see the per-configuration CODE_SIGN_ENTITLEMENTS below.
      - path: Inditalk/Inditalk.entitlements
        buildPhase: none
      - path: Inditalk/Inditalk.Release.entitlements
        buildPhase: none
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseMessaging
      # Callable Cloud Functions — used to mint short-lived TURN credentials at call
      # time (see TurnCredentialsService / functions/turn.js). The callable carries the
      # Firebase ID token automatically, which is what keeps the relay from being open
      # to anyone who extracts a URL from the binary.
      - package: Firebase
        product: FirebaseFunctions
      - package: WebRTC
        product: WebRTC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.cove.app
        INFOPLIST_FILE: Inditalk/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1"   # iPhone
        # App icon lives in the app-owned asset catalog Inditalk/Assets.xcassets.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      # APNs is environment-split: a sandbox-signed build receives no pushes once it
      # ships via TestFlight/App Store. Pin the entitlements per configuration rather
      # than relying on Xcode to rewrite aps-environment during archive.
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Inditalk/Inditalk.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Inditalk/Inditalk.Release.entitlements
    # On-device you still enable these capabilities in the Apple Developer portal +
    # Xcode "Signing & Capabilities" (they are account-side, not just source):
    #   - Push Notifications  (backs aps-environment above; also required for VoIP push)
    #   - Background Modes: Voice over IP, Audio, Remote notifications (in Info.plist)
    # CallKit + PushKit need no extra entitlement key. See APP_STORE_DEPLOYMENT_REPORT.md.

  InditalkTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: InditalkTests
    dependencies:
      - target: Inditalk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.cove.app.tests
        GENERATE_INFOPLIST_FILE: YES
